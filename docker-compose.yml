x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
    args:
      DOCKER_GID: ${DOCKER_GID:-999}
  image: project-airflow:latest
  restart: "no"
  env_file: .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER_airflow}:${POSTGRES_PASSWORD_airflow}@postgres_airflow:5432/${POSTGRES_DB_airflow}
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__DAG_CONCURRENCY: "2"
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
    AIRFLOW__SDK__SKIP_TASK_INSTANCE_LOGGING_WAIT: "true"
    AIRFLOW__CORE__ALLOW_ARBITRARY_LOGICAL_ID_LENGTHS: "true"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    POSTGRES_HOST: postgres_warehouse
    POSTGRES_PORT_warehouse: 5432
    PROJECT_ROOT: ${PROJECT_ROOT}
    SUPABASE_DB_URI: ${SUPABASE_DB_URI}
    NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
    SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config:/opt/airflow/config
    - ./scripts:/opt/airflow/scripts
    - ./sql:/opt/airflow/sql
    - ./datasets:/opt/airflow/datasets
    - ./dbt_gold_layer:/opt/airflow/dbt_gold_layer
    - ./models:/opt/airflow/models
  networks:
    - dataflow_network
  extra_hosts:
    - "host.docker.internal:host-gateway"

# ============================================================================
# CATATAN: SEMUA service di bawah yang punya `build:` sendiri dan target
# image tag YANG SAMA (project-airflow:latest) WAJIB diberi
# `args: DOCKER_GID: ${DOCKER_GID:-999}` yang SAMA. Kalau tidak,
# `docker compose build` akan build semuanya berurutan ke tag yang sama,
# dan build TERAKHIR yang menang -- bisa diam-diam menimpa image dengan
# DOCKER_GID default yang salah.
# ============================================================================

services:
  postgres_airflow:
    image: postgres:18
    container_name: postgres_airflow
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER_airflow} -d ${POSTGRES_DB_airflow}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      POSTGRES_USER: ${POSTGRES_USER_airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_airflow}
      POSTGRES_DB: ${POSTGRES_DB_airflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_airflow_data:/var/lib/postgresql
    networks:
      - dataflow_network

  postgres_warehouse:
    image: postgres:18
    container_name: postgres_warehouse
    shm_size: 1g
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER_warehouse} -d ${POSTGRES_DB_warehouse}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      POSTGRES_USER: ${POSTGRES_USER_warehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_warehouse}
      POSTGRES_DB: ${POSTGRES_DB_warehouse}
    ports:
      - "5435:5432"
    volumes:
      - postgres_warehouse_data:/var/lib/postgresql
    networks:
      - dataflow_network

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    restart: "no"
    command: bash -c "airflow db migrate && airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password AF720HDA 2>&1 || true && echo '✓ Initialization complete'"
    depends_on:
      postgres_airflow:
        condition: service_healthy

  redis:
    profiles:
      - disabled

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    entrypoint: bash
    command: ["-c", "airflow webserver"]
    ports:
      - "8085:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      postgres_airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    entrypoint: bash
    command: ["-c", "airflow scheduler"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config
      - ./scripts:/opt/airflow/scripts
      - ./sql:/opt/airflow/sql
      - ./datasets:/opt/airflow/datasets
      - ./dbt_gold_layer:/opt/airflow/dbt_gold_layer
      - ./models:/opt/airflow/models
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PROJECT_ROOT}:${PROJECT_ROOT}
    depends_on:
      postgres_airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    profiles:
      - disabled

  ml-trainer:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
      args:
        DOCKER_GID: ${DOCKER_GID:-999}
    image: project-airflow:latest
    container_name: ml-trainer
    command: python -m scripts.ml.customer_churn.model_trainer
    env_file: .env
    environment:
      POSTGRES_HOST: postgres_warehouse
      POSTGRES_PORT_warehouse: 5432
    volumes:
      - ./scripts:/opt/airflow/scripts
      - ./datasets:/opt/airflow/datasets
      - ./models:/opt/airflow/models
    networks:
      - dataflow_network
    depends_on:
      postgres_warehouse:
        condition: service_healthy
    working_dir: /opt/airflow
    profiles:
      - manual

  ml-trainer-conversion:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
      args:
        DOCKER_GID: ${DOCKER_GID:-999}
    image: project-airflow:latest
    container_name: ml-trainer-conversion
    command: python -m scripts.ml.session_conversion.model_trainer
    env_file: .env
    environment:
      POSTGRES_HOST: postgres_warehouse
      POSTGRES_PORT_warehouse: 5432
    volumes:
      - ./scripts:/opt/airflow/scripts
      - ./datasets:/opt/airflow/datasets
      - ./models:/opt/airflow/models
    networks:
      - dataflow_network
    depends_on:
      postgres_warehouse:
        condition: service_healthy
    working_dir: /opt/airflow
    profiles:
      - manual

  bootstrap-loader:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
      args:
        DOCKER_GID: ${DOCKER_GID:-999}
    image: project-airflow:latest
    container_name: bootstrap-loader
    command: python -m scripts.loaders.bootstrap_loader
    env_file: .env
    environment:
      POSTGRES_HOST: postgres_warehouse
      POSTGRES_PORT_warehouse: 5432
    volumes:
      - ./scripts:/opt/airflow/scripts
      - ./sql:/opt/airflow/sql
      - ./datasets:/opt/airflow/datasets
      - ./logs:/opt/airflow/logs
    networks:
      - dataflow_network
    depends_on:
      postgres_warehouse:
        condition: service_healthy
    working_dir: /opt/airflow
    profiles:
      - manual

  setup-operational-schema:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
      args:
        DOCKER_GID: ${DOCKER_GID:-999}
    image: project-airflow:latest
    container_name: setup-operational-schema
    command: python -m scripts.setup.setup_operational_schema
    env_file: .env
    environment:
      POSTGRES_HOST: postgres_warehouse
      POSTGRES_PORT_warehouse: 5432
    volumes:
      - ./scripts:/opt/airflow/scripts
      - ./sql:/opt/airflow/sql
      - ./datasets:/opt/airflow/datasets
      - ./logs:/opt/airflow/logs
    networks:
      - dataflow_network
    depends_on:
      postgres_warehouse:
        condition: service_healthy
    working_dir: /opt/airflow
    profiles:
      - manual

  setup-silver-schema:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
      args:
        DOCKER_GID: ${DOCKER_GID:-999}
    image: project-airflow:latest
    container_name: setup-silver-schema
    command: python -m scripts.setup.setup_silver_schema
    env_file: .env
    environment:
      POSTGRES_HOST: postgres_warehouse
      POSTGRES_PORT_warehouse: 5432
    volumes:
      - ./scripts:/opt/airflow/scripts
      - ./sql:/opt/airflow/sql
      - ./datasets:/opt/airflow/datasets
      - ./logs:/opt/airflow/logs
    networks:
      - dataflow_network
    depends_on:
      postgres_warehouse:
        condition: service_healthy
    working_dir: /opt/airflow
    profiles:
      - manual

  incremental-loader:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
      args:
        DOCKER_GID: ${DOCKER_GID:-999}
    image: project-airflow:latest
    container_name: incremental-loader
    command: python -m scripts.loaders.incremental_loader
    env_file: .env
    environment:
      POSTGRES_HOST: postgres_warehouse
      POSTGRES_PORT_warehouse: 5432
    volumes:
      - ./scripts:/opt/airflow/scripts
      - ./sql:/opt/airflow/sql
      - ./datasets:/opt/airflow/datasets
      - ./logs:/opt/airflow/logs
    networks:
      - dataflow_network
    depends_on:
      postgres_warehouse:
        condition: service_healthy
    working_dir: /opt/airflow
    profiles:
      - manual

volumes:
  postgres_airflow_data:
  postgres_warehouse_data:

networks:
  dataflow_network:
