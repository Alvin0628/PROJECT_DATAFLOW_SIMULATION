x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: project-airflow:latest
  restart: "no"
  env_file: .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER_airflow}:${POSTGRES_PASSWORD_airflow}@postgres_airflow:5432/${POSTGRES_DB_airflow}
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__DAG_CONCURRENCY: "2"
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
    AIRFLOW__SDK__SKIP_TASK_INSTANCE_LOGGING_WAIT: "true"
    AIRFLOW__CORE__ALLOW_ARBITRARY_LOGICAL_ID_LENGTHS: "true"
    POSTGRES_HOST: postgres_warehouse
    POSTGRES_PORT_warehouse: 5432
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config:/opt/airflow/config
    - ./scripts:/opt/airflow/scripts
    - ./sql:/opt/airflow/sql
    - ./datasets:/opt/airflow/datasets
  networks:
    - dataflow_network
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  postgres_airflow:
    image: postgres:18
    container_name: postgres_airflow
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER_airflow} -d ${POSTGRES_DB_airflow}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      POSTGRES_USER: ${POSTGRES_USER_airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_airflow}
      POSTGRES_DB: ${POSTGRES_DB_airflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_airflow_data:/var/lib/postgresql
    networks:
      - dataflow_network

  postgres_warehouse:
    image: postgres:18
    container_name: postgres_warehouse
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER_warehouse} -d ${POSTGRES_DB_warehouse}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      POSTGRES_USER: ${POSTGRES_USER_warehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_warehouse}
      POSTGRES_DB: ${POSTGRES_DB_warehouse}
    ports:
      - "5433:5432"
    volumes:
      - postgres_warehouse_data:/var/lib/postgresql
    networks:
      - dataflow_network

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    restart: "no"
    command: bash -c "airflow db migrate && airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password AF720HDA 2>&1 || true && echo '✓ Initialization complete'"
    depends_on:
      postgres_airflow:
        condition: service_healthy

  redis:
    profiles:
      - disabled

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    entrypoint: bash
    command: ["-c", "airflow webserver"]
    ports:
      - "8085:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      postgres_airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    entrypoint: bash
    command: ["-c", "airflow scheduler"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      postgres_airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    profiles:
      - disabled

  # Triggerer disabled - not needed for CeleryExecutor
  # airflow-triggerer:
  #   <<: *airflow-common
  #   container_name: airflow-triggerer
  #   command: triggerer
  #   healthcheck:
  #     test: ["CMD", "curl", "--fail", "http://localhost:8975/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 40s
  #   depends_on:
  #     postgres_airflow:
  #       condition: service_healthy

  # DAG Processor disabled - scheduler handles this in LocalExecutor mode
  # airflow-dag-processor:
  #   <<: *airflow-common
  #   container_name: airflow-dag-processor
  #   command: dag-processor
  #   depends_on:
  #     postgres_airflow:
  #       condition: service_healthy

  bootstrap-loader:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    image: project-airflow:latest
    container_name: bootstrap-loader
    command: python -m scripts.loaders.bootstrap_loader
    env_file: .env
    environment:
      POSTGRES_HOST: postgres_warehouse
      POSTGRES_PORT_warehouse: 5432
    volumes:
      - ./scripts:/opt/airflow/scripts
      - ./sql:/opt/airflow/sql
      - ./datasets:/opt/airflow/datasets
      - ./logs:/opt/airflow/logs
    networks:
      - dataflow_network
    depends_on:
      postgres_warehouse:
        condition: service_healthy
    working_dir: /opt/airflow
    profiles:
      - manual

  setup-operational-schema:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    image: project-airflow:latest
    container_name: setup-operational-schema
    command: python -m scripts.setup.setup_operational_schema
    env_file: .env
    environment:
      POSTGRES_HOST: postgres_warehouse
      POSTGRES_PORT_warehouse: 5432
    volumes:
      - ./scripts:/opt/airflow/scripts
      - ./sql:/opt/airflow/sql
      - ./datasets:/opt/airflow/datasets
      - ./logs:/opt/airflow/logs
    networks:
      - dataflow_network
    depends_on:
      postgres_warehouse:
        condition: service_healthy
    working_dir: /opt/airflow
    profiles:
      - manual

  incremental-loader:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    image: project-airflow:latest
    container_name: incremental-loader
    command: python -m scripts.loaders.incremental_loader
    env_file: .env
    environment:
      POSTGRES_HOST: postgres_warehouse
      POSTGRES_PORT_warehouse: 5432
    volumes:
      - ./scripts:/opt/airflow/scripts
      - ./sql:/opt/airflow/sql
      - ./datasets:/opt/airflow/datasets
      - ./logs:/opt/airflow/logs
    networks:
      - dataflow_network
    depends_on:
      postgres_warehouse:
        condition: service_healthy
    working_dir: /opt/airflow
    profiles:
      - manual

volumes:
  postgres_airflow_data:
  postgres_warehouse_data:

networks:
  dataflow_network:
